services:
  faces-game:
    build: .
    env_file:
      - .env
    container_name: faces-game
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATA_DIR=/app/data
    volumes:
      - faces-game-data:/app/data
    networks:
      - web

volumes:
  faces-game-data:

networks:
  web:
    external: true
